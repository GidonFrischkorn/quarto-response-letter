title: Response Letter
author: Gidon T. Frischkorn
version: 0.2.0
quarto-required: ">=1.4"
contributes:
  formats:
    common:
      number-sections: false
      link-citations: true
      language:
        response-reviewer-label: "Reviewer"
        response-editor-label: "Editor"
        response-comment-label: "Comment"
        response-reply-label: "Reply"
        response-changes-label: "Changes"
        response-quoted-label: "Manuscript"
        response-summary-title: "Summary of Changes"
        response-re-label: "Re:"
        response-dear-label: "Dear"
        response-round-label: "Revision"
        response-status-done: "✓"
        response-status-partial: "partially addressed"
        response-status-declined: "respectfully declined"
        response-status-todo: "TO DO"
      crossref:
        fig-title: "Response Figure"
        fig-prefix: "Response Figure"
        tbl-title: "Response Table"
        tbl-prefix: "Response Table"
      metadata:
        response-letter:
          colors:
            comment: "#B22222"
            reply: "#1E90FF"
            changes: "#8FBC8F"
            quoted: "#696969"
      filters:
        - response-letter.lua
    pdf:
      include-in-header: header.tex
      colorlinks: true
      linkcolor: MidnightBlue
      urlcolor: Teal
      citecolor: MidnightBlue
      papersize: a4
      fontsize: 11pt
      fig-pos: "H"
      geometry:
        - margin=25mm
    docx:
      reference-doc: reference.docx
    html:
      css: response-letter.css
      toc: true
      toc-depth: 1
      toc-location: left
      embed-resources: true
    typst:
      papersize: a4
      fontsize: 11pt
      # Typst consumes `margin` as a dict (x/y), unlike the pdf `geometry` list.
      margin:
        x: 25mm
        y: 25mm
      # No static asset ships for Typst: response-letter.lua injects the colored
      # box functions and the running header. Colors/crossref/language inherit
      # from `common`.
